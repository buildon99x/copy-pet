[package]
name = "clipcat"
version = "2.3.0"
edition = "2021"
description = "ClipCat - a desktop cat clipboard manager: every copy feeds the cat"
# The updater derives the release-check/download URLs from this (src/update.rs).
repository = "https://github.com/buildon99x/copy-pet"

[features]
# Force the portable (winit/softbuffer/rdev/arboard) backend even on Windows,
# so the cross-platform path can be exercised on the dev machine. On
# macOS/Linux the portable backend is always used and these crates are pulled
# in unconditionally.
portable = ["dep:winit", "dep:softbuffer", "dep:rdev", "dep:arboard"]

[dependencies]
# Core, all platforms
tiny-skia = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# System-font rasterizer for UI text (panel, toast). Pure Rust, no font files
# bundled — fonts are loaded from the OS at runtime. See ADR-0007.
ab_glyph = "0.2"

# Portable backend — optional here (enabled by the `portable` feature on
# Windows); always required on non-Windows via the target table below.
winit = { version = "0.30", optional = true }
softbuffer = { version = "0.4", optional = true }
rdev = { version = "0.5", optional = true }
# Clipboard read/write for the portable backend (the native Windows backend
# talks to the Win32 clipboard directly). Text only — see ADR-0005.
arboard = { version = "3", optional = true, default-features = false }

# --- Windows: native Win32 backend, winmm audio, local-time, registry --------
[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_Media_Audio",
]

# --- Unix (macOS + Linux): libc for local-time (localtime_r) -----------------
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# --- macOS native bits -------------------------------------------------------
# core-graphics: the global-input event tap (src/platform/mac_input.rs) and the
#   transparent presenter (src/platform/mac_present.rs). Same crate/version/
#   feature rdev already pulls in transitively — no new graph node.
# objc + foreign-types: drive the window's CALayer for the transparent present
#   path (ADR-0003). Both already in the tree via winit/rdev.
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.19", features = ["highsierra"] }
objc = "0.2"
foreign-types = "0.3"

# --- Non-Windows: portable backend is the only backend, always compiled ------
[target.'cfg(not(windows))'.dependencies]
winit = "0.30"
softbuffer = "0.4"
rdev = "0.5"
arboard = { version = "3", default-features = false }

# Windows resource (icon + version info) embedding only runs on Windows hosts.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[lints.rust]
# objc 0.2's msg_send!/class! macros expand to `#[cfg(feature = "cargo-clippy")]`,
# which check-cfg flags as unknown in this crate. Mark it expected so the lint
# still catches real cfg typos. Only reached on macOS (src/platform/mac_present.rs).
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
