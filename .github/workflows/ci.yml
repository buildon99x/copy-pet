name: CI

# main is development; production is the exact latest published release commit.
# Version tags request promotion. Failed builds never move production.
# See docs/releasing.md for bootstrap, recovery and Store handoff.
on:
  push:
    branches: [main, production]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  release-policy:
    name: release policy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test production promotion guards
        run: python3 -m unittest discover -s tests -p test_production.py
      - name: Validate main release candidate
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/production.py check "$RELEASE_TAG"
      - name: Audit production against latest published release
        if: github.ref == 'refs/heads/production'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/production.py audit

  # Cheap gate: did any SOURCE path change? Always runs, needs no toolchain.
  # On a missing/zero base ref (new branch, force-push) paths-filter fails
  # open (reports changed), so the build runs — the safe direction.
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.filter.outputs.source }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            source:
              - 'src/**'
              - 'build.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'examples/**'
              - 'tests/**'
              - 'scripts/**'
              - '.github/workflows/**'

  # CHANGELOG.md policy lint (format + version sync with Cargo.toml). Kept as
  # its own always-running job — pure bash, no Rust toolchain — so changelog/
  # doc-only PRs are still linted even when the build matrix is skipped.
  changelog:
    name: changelog lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/release.sh verify

  build:
    name: ${{ matrix.os }}
    needs: [changes, changelog, release-policy]
    # Build when any source path changed, OR always on a v* tag push (so the
    # release path is never filtered out — the tag clause short-circuits
    # before trusting the filter on a ref it can't diff).
    if: >-
      github.ref != 'refs/heads/production' &&
      (startsWith(github.ref, 'refs/tags/v') ||
      needs.changes.outputs.source == 'true')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # Default backend: native Win32 on Windows, portable elsewhere.
      - name: Build
        run: cargo build --release

      - name: Clippy
        run: cargo clippy --release

      - name: Test
        run: cargo test --release

      - name: Validate macOS cat assets and rendering
        if: runner.os == 'macOS'
        run: |
          sw_vers
          uname -m
          file target/release/clipcat
          cargo test --locked --release --example prepare_cat_atlas
          cargo run --locked --release --example preview -- "$RUNNER_TEMP/clipcat-macos-validation/previews"
          cargo run --locked --release --example font_diagnostics -- "$RUNNER_TEMP/clipcat-macos-validation/fonts"
          cargo run --locked --release --example review_at_density -- "$RUNNER_TEMP/clipcat-macos-validation/density"

      - name: Package universal macOS test app
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          if [ "$(uname -m)" = "arm64" ]; then
            cross_target=x86_64-apple-darwin
          else
            cross_target=aarch64-apple-darwin
          fi
          rustup target add "$cross_target"
          cargo build --locked --release --target "$cross_target"
          python3 scripts/package_macos_test.py target/release/clipcat "target/$cross_target/release/clipcat"

      - name: Smoke test macOS app and clipboard
        if: runner.os == 'macOS'
        run: |
          python3 scripts/validate_macos.py dist/macos-test/ClipCat.app/Contents/MacOS/clipcat
          swift scripts/validate_macos_paste.swift dist/macos-test/ClipCat.app/Contents/MacOS/clipcat

      - name: Upload universal macOS test build
        if: success() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: clipcat-macos-universal-test
          path: |
            dist/macos-test/ClipCat-macos-universal-test.zip
            dist/macos-test/README.txt
            dist/macos-test/build-info.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload macOS validation evidence
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: clipcat-macos-validation
          path: ${{ runner.temp }}/clipcat-macos-validation
          if-no-files-found: warn

      # Also exercise the portable backend on Windows so it can't bit-rot.
      - name: Clippy (portable backend on Windows)
        if: runner.os == 'Windows'
        run: cargo clippy --release --features portable

      # The in-app updater (src/update.rs) downloads release assets from
      # github.com/<repo>/releases/download/<tag>/<name>; these names are
      # part of that contract — keep them in sync with update::{WINDOWS_ASSET,MACOS_ASSET}.
      - name: Prepare release asset (Windows)
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist/release
          cp target/release/clipcat.exe dist/release/clipcat-windows-x86_64.exe

      # tar keeps the executable bit (macos-latest runners are arm64)
      - name: Prepare release asset (macOS)
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'macOS'
        run: |
          mkdir -p dist/release
          tar -czf dist/release/clipcat-macos-arm64.tar.gz -C target/release clipcat
          if [ "$(uname -m)" = "arm64" ]; then
            cross_target=x86_64-apple-darwin
          else
            cross_target=aarch64-apple-darwin
          fi
          python3 scripts/package_macos_test.py --release target/release/clipcat "target/$cross_target/release/clipcat"
          cp dist/macos-release/clipcat-macos-universal.zip dist/release/

      - name: Upload release artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: dist/release/*
          if-no-files-found: error

  # Publishes the GitHub Release the in-app updater checks against. Runs on
  # an ubuntu runner but builds nothing — it only attaches the artifacts.
  release:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, release-policy, changelog]
    concurrency:
      group: production-release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recheck promotion after acquiring release lock
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/production.py ready "$RELEASE_TAG"
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Publish validated release and promote production
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Recovery never overwrites an already public version's binaries.
          if ! gh release view "$RELEASE_TAG" --json isDraft > release-state.json; then
            gh release create "$RELEASE_TAG" dist/* --verify-tag --draft \
              --title "ClipCat $RELEASE_TAG" --notes-from-tag
            gh release view "$RELEASE_TAG" --json isDraft > release-state.json
          fi
          if python3 -c 'import json,sys; sys.exit(0 if json.load(open("release-state.json"))["isDraft"] else 1)'; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
            gh release edit "$RELEASE_TAG" --draft=false --latest
          fi
          python3 scripts/production.py promote "$RELEASE_TAG"
          python3 scripts/production.py audit
