name: CI

# Quality gates run once per change: on PRs and on main. Release binaries
# are built ONLY for version tags pushed by scripts/release.sh — never on
# PR creation or branch pushes. Linux is deliberately not built in CI (the
# portable backend is exercised by the macOS job and by the Windows
# `--features portable` lint).
#
# Doc/asset-only changes skip the heavy windows/macos build matrix. The skip
# is done with a `changes` detection job + a job-level `if:` (NOT top-level
# paths-ignore), so the matrix check contexts still report — as "skipped" —
# instead of going missing. A skipped REQUIRED status check passes branch
# protection, so doc-only PRs stay mergeable even when the matrix is required.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Cheap gate: did any SOURCE path change? Always runs, needs no toolchain.
  # On a missing/zero base ref (new branch, force-push) paths-filter fails
  # open (reports changed), so the build runs — the safe direction.
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.filter.outputs.source }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            source:
              - 'src/**'
              - 'build.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'examples/**'
              - 'tests/**'
              - 'scripts/**'
              - '.github/workflows/**'

  # CHANGELOG.md policy lint (format + version sync with Cargo.toml). Kept as
  # its own always-running job — pure bash, no Rust toolchain — so changelog/
  # doc-only PRs are still linted even when the build matrix is skipped.
  changelog:
    name: changelog lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/release.sh verify

  build:
    name: ${{ matrix.os }}
    needs: changes
    # Build when any source path changed, OR always on a v* tag push (so the
    # release path is never filtered out — the tag clause short-circuits
    # before trusting the filter on a ref it can't diff).
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      needs.changes.outputs.source == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # A tagged release must ship a binary whose embedded version matches the
      # tag. The in-app updater (src/update.rs) reads the newest tag from the
      # /releases/latest redirect and compares it to CARGO_PKG_VERSION; a tag
      # pushed against a Cargo.toml that was never bumped (e.g. v2.3.0 built from
      # a 2.2.0 tree) makes the swapped-in binary keep identifying as the old
      # version, so the daily check re-prompts forever and the update never
      # "takes". Fail the release build here, before any asset is published.
      # Cut releases with scripts/release.sh, which bumps the version in the same
      # commit it tags. See LNR-0009.
      - name: Verify tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag_ver="${GITHUB_REF_NAME#v}"
          crate_ver=$(sed -n 's/^version = "\([0-9][^"]*\)".*/\1/p' Cargo.toml | head -n1)
          echo "tag=$tag_ver cargo=$crate_ver"
          if [ "$tag_ver" != "$crate_ver" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $crate_ver — cut releases with scripts/release.sh so the version is bumped in the tagged commit."
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # Default backend: native Win32 on Windows, portable elsewhere.
      - name: Build
        run: cargo build --release

      - name: Clippy
        run: cargo clippy --release

      - name: Test
        run: cargo test --release

      # Also exercise the portable backend on Windows so it can't bit-rot.
      - name: Clippy (portable backend on Windows)
        if: runner.os == 'Windows'
        run: cargo clippy --release --features portable

      # The in-app updater (src/update.rs) downloads release assets from
      # github.com/<repo>/releases/download/<tag>/<name>; these names are
      # part of that contract — keep them in sync with update::WINDOWS_ASSET.
      - name: Prepare release asset (Windows)
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Windows'
        shell: bash
        run: |
          mkdir dist
          cp target/release/clipcat.exe dist/clipcat-windows-x86_64.exe

      # tar keeps the executable bit (macos-latest runners are arm64)
      - name: Prepare release asset (macOS)
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'macOS'
        run: |
          mkdir dist
          tar -czf dist/clipcat-macos-arm64.tar.gz -C target/release clipcat

      - name: Upload release artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  # Publishes the GitHub Release the in-app updater checks against. Runs on
  # an ubuntu runner but builds nothing — it only attaches the artifacts.
  release:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Release notes come from the annotated tag (scripts/release.sh put
      # the rotated CHANGELOG section there). Re-runs just re-upload assets.
      - name: Create GitHub release with binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "ClipCat $GITHUB_REF_NAME" \
            --notes-from-tag \
          || gh release upload "$GITHUB_REF_NAME" dist/* --clobber
