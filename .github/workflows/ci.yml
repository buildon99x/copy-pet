name: CI

# Quality gates run once per change: on PRs and on main. Release binaries
# are built ONLY for version tags pushed by scripts/release.sh — never on
# PR creation or branch pushes.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # winit + softbuffer (X11/Wayland) and rdev (XRecord/XTest) system libs
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libxkbcommon-dev libwayland-dev \
            libx11-dev libxi-dev libxtst-dev libxcursor-dev libxrandr-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      # Default backend: native Win32 on Windows, portable elsewhere.
      - name: Build
        run: cargo build --release

      - name: Clippy
        run: cargo clippy --release

      - name: Test
        run: cargo test --release

      # CHANGELOG.md policy lint (format + version sync with Cargo.toml)
      - name: Changelog lint
        if: runner.os == 'Linux'
        run: bash scripts/release.sh verify

      # Also exercise the portable backend on Windows so it can't bit-rot.
      - name: Clippy (portable backend on Windows)
        if: runner.os == 'Windows'
        run: cargo clippy --release --features portable

      # Release artifacts: only for vX.Y.Z tags (cut by scripts/release.sh)
      - name: Upload release binary
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: clipcat-${{ github.ref_name }}-${{ matrix.os }}
          path: |
            target/release/clipcat
            target/release/clipcat.exe
          if-no-files-found: ignore
